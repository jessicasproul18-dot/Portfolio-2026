server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html index.php;
  error_page 404 /404.html;

  # Keep direct requests for /404.html from appearing as a normal page.
  location = /404.html {
    internal;
  }

  # Static export: serve real files only; unknown paths return HTTP 404.
  location / {
    try_files $uri $uri/ =404;
  }

  # Deny hidden files (.htaccess, .env, etc.)
  location ~ /\. {
    deny all;
  }

  # Block config.php in any casing/path variant (hide existence with 404).
  location ~* config\.php {
    return 404;
  }

  location ~* (^|/)\.env(/|$) {
    deny all;
  }

  # `/file.php` and `/file.php/` — $1 is the script path; try_files uses $1 so `/info.php/` still resolves.
  location ~ ^(.+\.php)(/.*)?$ {
    try_files $1 =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$1;
    fastcgi_param PATH_INFO $2;
    fastcgi_pass php:9000;
  }
}